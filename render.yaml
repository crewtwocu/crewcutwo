# Render Blueprint — Crew match app (Docker + ephemeral SQLite)
# Deploy: https://dashboard.render.com/blueprints → New Blueprint Instance
# Or: https://render.com/deploy?repo=https://github.com/crewtwocu/crewcutwo
#
# Free deploy now: it sleeps when idle and has no persistent filesystem.
# Upgrade to Starter with a disk on Friday for durable SQLite storage.
# After first sync: set sync:false secrets in the dashboard, then set
# PUBLIC_BASE_URL to the service https URL (no trailing slash).

services:
  - type: web
    name: crewcutwo
    runtime: docker
    plan: free
    region: oregon
    rootDir: app
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: CREW_MOCK_ONLY
        value: "0"
      - key: DB_PATH
        # Free web services have ephemeral filesystems; SQLite resets on restart,
        # spin-down, or deploy. Add a disk after upgrading to Starter.
        value: /app/data/crew.db
      # Render injects PORT; app listens on process.env.PORT
      - key: PUBLIC_BASE_URL
        sync: false
      - key: XMRCHECKOUT_API_KEY
        sync: false
      - key: XMRCHECKOUT_BASE_URL
        sync: false
      - key: XMRCHECKOUT_WEBHOOK_SECRET
        sync: false
      - key: XMRCHECKOUT_STORE_ID
        sync: false
