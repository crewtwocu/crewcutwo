# Render Blueprint — Crew match app (Docker + persistent SQLite on Starter)
# Deploy: https://dashboard.render.com/blueprints → New Blueprint Instance
# Or: https://render.com/deploy?repo=https://github.com/crewtwocu/crewcutwo
#
# Starter + disk: always-on, SQLite at /app/data persists across deploys.
# After first sync: set sync:false secrets in the dashboard, then set
# PUBLIC_BASE_URL to the service https URL (no trailing slash).

services:
  - type: web
    name: crewcutwo
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    healthCheckPath: /health
    numInstances: 1
    disk:
      name: crew-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: CREW_MOCK_ONLY
        value: "0"
      - key: DB_PATH
        value: /app/data/crew.db
      # Render injects PORT; app listens on process.env.PORT
      - key: PUBLIC_BASE_URL
        sync: false
      - key: XMRCHECKOUT_API_KEY
        sync: false
      - key: XMRCHECKOUT_BASE_URL
        sync: false
      - key: XMRCHECKOUT_WEBHOOK_SECRET
        sync: false
      - key: XMRCHECKOUT_STORE_ID
        sync: false
      # Optional Get-a-reply outbound (stub if unset)
      - key: CREW_CONTACT_OPS_EMAIL
        sync: false
      - key: CREW_CONTACT_OPS_PHONE
        sync: false
      - key: CREW_SMTP_HOST
        sync: false
      - key: CREW_SMTP_PORT
        sync: false
      - key: CREW_SMTP_USER
        sync: false
      - key: CREW_SMTP_PASS
        sync: false
      - key: CREW_SMTP_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
